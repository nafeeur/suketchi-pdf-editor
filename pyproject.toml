[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suketchi"
version = "0.1.0"
description = "A lightweight, free, and open-source PDF reader and editor."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Nafeeur Rahman" },
]
keywords = ["pdf", "pdf-editor", "pdf-reader", "pyqt6", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Office/Business",
]
dependencies = [
    "PyQt6>=6.4",
    "PyMuPDF>=1.23",
]

[project.optional-dependencies]
spellcheck = ["pyspellchecker>=0.7"]
docx = ["python-docx>=1.0"]
sign = ["pyHanko>=0.22", "pyhanko-certvalidator>=0.26"]
all = ["pyspellchecker>=0.7", "python-docx>=1.0", "pyHanko>=0.22", "pyhanko-certvalidator>=0.26"]

[project.urls]
Homepage = "https://github.com/nafeeur/suketchi-pdf-editor"
Repository = "https://github.com/nafeeur/suketchi-pdf-editor"
Issues = "https://github.com/nafeeur/suketchi-pdf-editor/issues"

[project.scripts]
suketchi = "suketchi:main"

[tool.hatch.build.targets.wheel]
packages = ["src/suketchi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]
